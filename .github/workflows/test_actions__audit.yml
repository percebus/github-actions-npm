name: Test actions/audit

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default:
    name: default
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main
      - uses: ./.github/actions/audit

  #
  working-directory__matrix:
    needs: default
    permissions:
      contents: read
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        working-directory:
          - sub-package

    runs-on: ubuntu-latest
    name: "prefix ${{ matrix.working-directory }}"
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
      - uses: percebus/github-actions-node/.github/actions/setup@main
      - uses: ./.github/actions/audit
        with:
          working-directory: node/${{ matrix.working-directory }}
