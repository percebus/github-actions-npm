name: "Re-usable: npm update"

on:
  workflow_call: # SRC: https://docs.github.com/en/actions/using-workflows/reusing-workflows
    secrets:
      ssh-private-key:
        description: ssh-private-key
        required: false

    inputs:
      working-directory:
        type: string
        description: working-directory
        required: false
        default: "."

      npm_audit_cli_options:
        description: npm audit CLI options
        type: string
        required: false
        default: "--package-lock-only"

      ref_name:
        description: peter-evans/create-pull-request branch
        type: string
        required: false
        default: automation/npm-update

      commit-message:
        description: peter-evans/create-pull-request commit-message
        type: string
        required: false
        default: "chore(deps): npm update"

      pull_request_title:
        description: peter-evans/create-pull-request title
        type: string
        required: false
        default: "chore(deps): npm update"

      pull_request_body:
        description:
        type: string
        required: false
        default: |
          Automated security updates generated by `npm update`.

          Please review the changes to the `package-lock.json` (and/or `package.json`) to ensure compatibility.

permissions:
  contents: read

jobs:
  npm_update:
    name: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        with:
          ssh-private-key: ${{ secrets.ssh-private-key }}

      - uses: percebus/github-actions-node/.github/actions/setup@main

      # TODO? pass more args?
      - name: npm update
        run: npm update --save --package-lock-only --prefix ${{ inputs.working-directory }} 

      # XXX? redundant? do vanilla 'npm audit' to take note of pending vulnerabilities?
      - name: npm audit fix
        run: npm audit fix ${{ inputs.npm_audit_cli_options }} --prefix ${{ inputs.working-directory }} || echo "::warning::npm audit found vulnerabilities!"
        continue-on-error: true

      # TODO? move to -commons? create a -github?
      # SRC: https://github.com/peter-evans/create-pull-request/
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v.8.1.1
        name: Create Pull Request
        with:
          branch: ${{ inputs.ref_name }}
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.pull_request_title }}
          body: ${{ inputs.pull_request_body }}
          delete-branch: true
          labels: |
            security
            dependencies
            package.json
            package-lock.json
