name: npm run script

on:
  workflow_call: # SRC: https://docs.github.com/en/actions/using-workflows/reusing-workflows
    inputs:
      runs-on:
        type: string
        description: The type of machine to run on
        required: false
        default: ubuntu-latest

      ssh-private-key:
        type: string
        description: SSH private key
        required: false

      working-directory:
        type: string
        description: working-directory
        required: false
        default: "."

      npm_audit:
        description: Run npm audit
        type: boolean
        required: false
        default: false

      npm_audit_cli_options:
        description: npm audit CLI options
        type: string
        required: false
        default: "--package-lock-only"

      npm_audit_continue-on-error:
        description: continue-on-error
        type: boolean
        required: false
        default: true

      script:
        type: string
        description: The npm script to run.
        required: false
        default: test

permissions:
  contents: read

jobs:
  npm_run:
    name: run ${{ inputs.script }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        with:
          ssh-private-key: ${{ inputs.ssh-private-key }}

      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: npm audit
        if: ${{ inputs.npm_audit }}
        shell: bash # Slight differences in powershell when runs on windows-latest
        run: npm audit ${{ inputs.npm_audit_cli_options }} --prefix ${{ inputs.working-directory }} || echo "::warning::npm audit found vulnerabilities!"
        continue-on-error: ${{ inputs.npm_audit_continue-on-error }}

      - uses: percebus/github-actions-npm/.github/actions/install@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: npm run ${{ inputs.script }}
        # NOTE: --cwd not working
        working-directory: ${{ inputs.working-directory }}
        run: npm run ${{ inputs.script }}
