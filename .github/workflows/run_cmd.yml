name: "Re-usable: npm install + {cmd}"

on:
  workflow_call: # SRC: https://docs.github.com/en/actions/using-workflows/reusing-workflows
    secrets:
      ssh-private-key:
        description: ssh-private-key
        required: false

    inputs:
      runs-on:
        type: string
        description: The type of machine to run on
        required: false
        default: ubuntu-latest

      # XXX when all references have been fixed
      ssh-private-key:
        type: string
        description: SSH private key
        required: false

      working-directory:
        type: string
        description: working-directory
        required: false
        default: "."

      npm_audit:
        description: Run npm audit
        type: boolean
        required: false
        default: true

      npm_audit_cli_options:
        description: npm audit CLI options
        type: string
        required: false
        default: "--package-lock-only"

      npm_audit_continue-on-error:
        description: continue-on-error
        type: boolean
        required: false
        default: false

      cmd:
        type: string
        description: The bash command to run.
        required: false
        default: npm test

permissions:
  contents: read

jobs:
  run_cmd:
    name: ${{ inputs.cmd }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        with:
          ssh-private-key: ${{ secrets.ssh-private-key || inputs.ssh-private-key }}

      - uses: percebus/github-actions-node/.github/actions/setup@main

      - name: npm audit
        if: ${{ inputs.npm_audit }}
        uses: percebus/github-actions-npm/.github/actions/audit@main
        continue-on-error: ${{ inputs.npm_audit_continue-on-error }}
        with:
          working-directory: ${{ inputs.working-directory }}
          npm_audit_cli_options: ${{ inputs.npm_audit_cli_options }}
          continue-on-error: ${{ inputs.npm_audit_continue-on-error && 'true' || 'false' }}

      - uses: percebus/github-actions-npm/.github/actions/install@main
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: ${{ inputs.cmd }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.cmd }}
