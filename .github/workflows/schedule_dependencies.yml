name: "Cron: npm update dependencies"

on:
  workflow_dispatch: # Allows you to trigger it manually from the Actions t
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  root:
    name: npm
    uses: ./.github/workflows/update.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      ref_name: automation/npm_update/root

  sub-package:
    name: npm --prefix=node/sub-package
    uses: ./.github/workflows/update.yml
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      working-directory: node/sub-package
      ref_name: automation/npm_update/sub-package
